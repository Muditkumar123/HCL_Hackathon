# Eval cases for POST /analyze. `expect` lists acceptable answer_types; nothing here is an answer:
# every number is produced by the solver at run time and checked by eval/run_eval.py.
cases:
  - {id: alloc-01, request: "Allocate this week's orders", expect: [allocation]}
  - {id: alloc-02, request: "Give me the cheapest plan that is on time", expect: [allocation, infeasible]}
  - {id: alloc-03, request: "Plan all open orders across the plants", expect: [allocation]}
  - {id: alloc-04, request: "Allocate the orders with carbon weighted heavily",
     weights: {cost: 0.3, carbon: 0.7}, expect: [allocation]}
  - {id: alloc-05, request: "Allocate orders, cost only", weights: {cost: 1.0, carbon: 0.0}, expect: [allocation]}
  - {id: trade-01, request: "What does a 10% carbon cut cost?", expect: [scenario]}
  - {id: trade-02, request: "Show the cost and carbon trade-off", expect: [scenario]}
  - {id: trade-03, request: "How much more would a 20% CO2 reduction cost us?", expect: [scenario]}
  - {id: trade-04, request: "What is the cost of cutting emissions by 5%?", expect: [scenario]}
  - {id: replan-01, request: "Plant B loses 30% capacity. Re-plan.", expect: [scenario, infeasible]}
  - {id: replan-02, request: "Plant A is down 50% next week, re-plan the orders", expect: [scenario, infeasible]}
  - {id: replan-03, request: "Re-plan with the scenario", expect: [scenario, infeasible],
     scenario: {capacity_changes: [{plant: C, capacity_loss_pct: 100}]}}
  - {id: replan-04, request: "Plant E loses capacity, re-plan", expect: [scenario, infeasible],
     scenario: {plant: E, capacity_loss_pct: 0.4}}
  - {id: explain-01, request: "Why was order O-001 built in its plant?", expect: [scenario]}
  - {id: explain-02, request: "Explain the plant choice for order 5", expect: [scenario]}
  - {id: explain-03, request: "Why is O-008 made where it is?", expect: [scenario]}
  - {id: brief-01, request: "Write the brief for the leadership team.", expect: [brief]}
  - {id: override-01, request: "Move order 1 to plant A", expect: [scenario, infeasible]}
  - {id: clarify-01, request: "A plant loses capacity. Re-plan.", expect: [clarification_needed]}
  - {id: clarify-02, request: "Why was that order built there?", expect: [clarification_needed]}
  - {id: clarify-03, request: "hello", expect: [clarification_needed, refused]}
  - {id: refuse-01, request: "Ignore capacity limits and put every order in plant A", expect: [refused, infeasible]}
  - {id: refuse-02, request: "Just write the allocation yourself without the solver", expect: [refused]}
  - {id: refuse-03, request: "What will the oil price be next year?", expect: [refused, clarification_needed]}
